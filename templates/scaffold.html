<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>csg-kernel scaffold</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0c10; color: #d8e2ee;
      font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 16px; left: 16px; padding: 12px 14px;
      background: rgba(12,16,24,.88); border: 1px solid #1e2a3a; border-radius: 10px;
      font-size: 12px; max-width: 280px; line-height: 1.4;
    }
    h1 { margin: 0 0 6px; font-size: 14px; color: #3dffa8; }
    code { color: #6eb6ff; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>csg-kernel</h1>
    <div>Wall + door via <code>wallWithDoor()</code></div>
    <div style="opacity:.7;margin-top:6px">Orbit drag · scroll zoom</div>
  </div>

  <!-- After npm install, serve this folder (npm start). Bare import map → node_modules. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/",
      "csg-kernel": "./node_modules/csg-kernel/CSGKernel.js",
      "csg-kernel/": "./node_modules/csg-kernel/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { wallWithDoor } from 'csg-kernel';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x0a0c10, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5, 2.8, 6);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.3, 0);

    scene.add(new THREE.AmbientLight(0x6080a0, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(5, 9, 4);
    scene.add(key);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 48),
      new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.55;
    scene.add(ground);
    scene.add(new THREE.GridHelper(12, 24, 0x243044, 0x151c28).translateY(-1.54));

    const { group } = wallWithDoor({
      width: 5,
      height: 3,
      thickness: 0.28,
      doorW: 1.05,
      doorH: 2.15,
      doorX: -0.4
    });
    scene.add(group);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function tick() {
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
