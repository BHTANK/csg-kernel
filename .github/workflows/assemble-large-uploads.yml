name: assemble-large-uploads
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-large-uploads.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full package files and commit
        run: |
          set -euo pipefail
          curl -fsSL -o CSGKernel.mono.js https://files.catbox.moe/wsq7t6.js
          curl -fsSL -o kit/helpers-catalog.js https://files.catbox.moe/t0eo8i.js
          curl -fsSL -o kit/helpers-catalog.json https://files.catbox.moe/uagyyj.json
          # fallback mirrors
          if [ "$(wc -c < CSGKernel.mono.js)" -lt 20000 ]; then
            curl -fsSL -o CSGKernel.mono.js https://fars.ee/G_gu.js
          fi
          if [ "$(wc -c < kit/helpers-catalog.js)" -lt 20000 ]; then
            curl -fsSL -o kit/helpers-catalog.js https://fars.ee/eu-N.js
          fi
          if [ "$(wc -c < kit/helpers-catalog.json)" -lt 20000 ]; then
            curl -fsSL -o kit/helpers-catalog.json https://fars.ee/wZZq.json
          fi
          echo "sizes: mono=$(wc -c < CSGKernel.mono.js) js=$(wc -c < kit/helpers-catalog.js) json=$(wc -c < kit/helpers-catalog.json)"
          test "$(wc -c < CSGKernel.mono.js)" -gt 20000
          test "$(wc -c < kit/helpers-catalog.js)" -gt 20000
          test "$(wc -c < kit/helpers-catalog.json)" -gt 20000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSGKernel.mono.js kit/helpers-catalog.js kit/helpers-catalog.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace mono placeholder + add helpers-catalog (Wallace BSP + BHTANK; CREDITS.md)"
            git push
          fi
